services:
  ros:  # Usa variable de entorno o default a 'humble'
    image: ros_${ROS_DISTRO:-humble}  # Nombre de imagen dinámico
    privileged: true
    build: 
      context: .
      dockerfile: ./Dockerfile
      args:
        - ROS_DISTRO=${ROS_DISTRO:-humble}  # Pasa la versión al Dockerfile
      network: host
    container_name: cont_ros_${ROS_DISTRO:-humble}  # Nombre dinámico
    environment:
      - DISPLAY=${DISPLAY_VALUE:-host.docker.internal:0.0}
      - QT_X11_NO_MITSHM=1
      - ROS_DISTRO=${ROS_DISTRO:-humble}  # Disponible dentro del contenedor
    volumes:
      # Permisos X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority:rw
      # Workspace
      - ./.devcontainer/.vscode:/ros2_ws/.vscode:rw
      - ./proyecto_ros:/ros2_ws/src
    network_mode: "host"